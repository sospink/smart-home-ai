# ═══════════════════════════════════════════════════════
# Smart Home AI Backend — 本地开发配置模板
# 优先级：显式环境变量 > config.yaml > 代码默认值
# 注意：本文件只能保存非敏感默认值。数据库密码、HA Token、Dify Key、Dataset Key、Agent Key
# 必须通过环境变量或后台系统设置注入，真实凭证泄露后必须立即轮换。
# ═══════════════════════════════════════════════════════

# ── 数据库 ──
database:
  # 留空则使用代码默认值或 DATABASE_URL 环境变量。
  # 示例：mysql+aiomysql://<USER>:<PASSWORD>@<HOST>:3306/smart_home_web
  url: ""

# ── JWT 认证 ──
jwt:
  # 生产环境必须通过 SECRET_KEY 环境变量覆盖，并使用高强度随机值。
  secret_key: "CHANGE_ME_USE_SECRET_KEY_ENV"
  algorithm: HS256
  access_token_expire_minutes: 1440

# ── 外部服务 ──
services:
  ollama:
    base_url: http://localhost:11434

  homeassistant:
    base_url: http://192.168.34.190:8123
    token: ""

  dify:
    base_url: http://192.168.34.190
    api_key: ""
    dataset_api_key: ""

  influxdb:
    url: http://localhost:8086
    token: ""
    org: smart-home
    bucket: smart-home-data

# ── CORS 跨域 ──
cors:
  origins:
    - http://localhost:3000
    - http://localhost:8088

# ── Agent API Key（供 Dify 工作流调用后端接口）──
agent:
  api_key: ""
