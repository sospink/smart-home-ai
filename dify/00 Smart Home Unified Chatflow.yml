app:
  description: 智慧家居统一对话流（单 DSL 正式入口），内嵌设备控制、知识问答、数据查询和兜底问答能力。
  icon: ''
  icon_background: '#DBEAFE'
  mode: advanced-chat
  name: 00 Smart Home Unified Chatflow
  use_icon_as_answer_icon: true
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/tongyi:0.1.19@12ddda76bb473f9beb52d2ea2a67412d54924f93a29465fffb8635ba62b409c3
    version: null
kind: app
version: 0.5.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: 平台后端基础地址；本地 Dify 需使用开发机局域网地址，不能使用容器内 localhost，不带结尾斜杠。
    id: 8e189df1-7a0e-45c8-a27d-42c7fb9a6f00
    name: BACKEND_BASE_URL
    selector:
    - env
    - BACKEND_BASE_URL
    value: http://192.168.251.4:8000
    value_type: string
  - description: 平台 Agent 代理调用密钥，对应后端运行时配置中的 Agent API Key。
    id: b954596d-1f18-45c7-9446-7a56f48b6322
    name: AGENT_API_KEY
    selector:
    - env
    - AGENT_API_KEY
    value: ''
    value_type: secret
  features:
    file_upload:
      allowed_file_extensions:
      - .PDF
      - .MD
      - .TXT
      allowed_file_types:
      - document
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: true
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: '你好，我是智慧家居统一智能体。

      我可以在同一个应用内完成：家居控制、知识问答、数据查询和系统状态查询。

      '
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 查询筒灯当前状态
    - 根据知识库回答：系统支持哪些核心能力？
    - 查询当前室内温度和最近 24 小时趋势
    - 查询当前系统服务状态
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        sourceType: start
        targetType: llm
      id: start-to-enhance
      source: start_node
      sourceHandle: source
      target: llm_query_enhance
      targetHandle: target
      type: custom
