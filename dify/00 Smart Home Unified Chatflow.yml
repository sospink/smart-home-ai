          - id: control-body
            key: ''
            type: text
            value: '{"service":"{{#control_build_request.action#}}","role":"{{#control_build_request.role#}}","data":{{#control_extract.data_json#}}}'
          type: raw-text
        desc: 通过平台设备 ID 和映射角色控制 HA
        headers: 'X-Agent-Key:{{#env.AGENT_API_KEY#}}

          Content-Type:application/json'
        method: post
        params: ''
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 1000
        selected: false
        ssl_verify: false
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 15
          max_write_timeout: 10
        title: 控制设备
        type: http-request
        url: '{{#env.BACKEND_BASE_URL#}}{{#control_build_request.control_url#}}'
        variables: []
      height: 136
      id: control_execute
      position:
        x: 2180
        y: 40
      positionAbsolute:
        x: 2180
        y: 40
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
        desc: 将控制结果转为用户回复
        memory:
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 5
        model:
          completion_params:
            max_tokens: 260
            temperature: 0.2
            top_p: 0.9
          mode: chat
          name: qwen3-max
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: control-present-system
          role: system
          text: |
            你是智能家居控制助手。根据设备控制执行结果，生成简洁中文回复。
            必须说明设备名、执行动作和平台返回状态。
            如果 confirmation=physical_pending，只能回复“控制命令已由 Home Assistant 接受，物理设备是否动作仍需现场确认”，禁止说“已打开”“已关闭”或“执行成功”。
            如果 confirmation=confirmed，才可以说明 Home Assistant 回读已确认；如果失败，说明原因并建议检查设备映射或连接状态。
            不要输出 JSON。
