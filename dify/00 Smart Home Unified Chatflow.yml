          text: '{{#sys.query#}}'
        selected: false
        title: 查询增强
        type: llm
        variables: []
        vision:
          enabled: false
      height: 116
      id: llm_query_enhance
      position:
        x: 380
        y: 360
      positionAbsolute:
        x: 380
        y: 360
      selected: false
