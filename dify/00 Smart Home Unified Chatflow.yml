      targetPosition: left
      type: custom
      width: 242
    - data:
        classes:
        - id: class_control
          name: 控制设备
        - id: class_rag
          name: 知识问答
        - id: class_data
          name: 数据查询
        - id: class_general
          name: 其他问题
        desc: 单体 Chatflow 意图路由
        instructions: |
          分类规则：
          1) 控制设备：开关、调温、执行动作类请求。示例：打开客厅灯、关闭卧室空调。
          2) 知识问答：文档、说明、FAQ、概念解释。示例：如何配置工作流、系统支持什么能力。
          3) 数据查询：趋势、统计、历史、报表、系统服务健康状态。示例：最近24小时趋势、当前系统服务状态。
          4) 其余归到其他问题。
          优先级：若出现明确控制动词（打开/关闭/调高/调低/设置）优先判为“控制设备”；若出现“服务、系统、健康、状态、趋势、历史”优先判为“数据查询”。
        model:
          completion_params:
            frequency_penalty: 0
            max_tokens: 128
            presence_penalty: 0
            temperature: 0
            top_p: 0.9
          mode: chat
          name: qwen3-max
          provider: langgenius/tongyi/tongyi
        query_variable_selector:
        - llm_query_enhance
        - text
        selected: false
        title: 意图分类器
        topics: []
        type: question-classifier
        vision:
          enabled: false
      height: 290
      id: intent_classifier
      position:
        x: 680
        y: 320
      positionAbsolute:
        x: 680
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
        desc: 解析控制意图为结构化 JSON
        memory:
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 5
        model:
          completion_params:
            max_tokens: 300
            temperature: 0.1
            top_p: 0.9
          mode: chat
          name: qwen3-max
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: control-parse-system
          role: system
          text: |
            你是智能家居控制意图解析器。将用户的自然语言指令解析为 JSON。
            设备名称来自平台动态台账，不要假设固定房间或固定实体 ID。
            可用动作包括 turn_on、turn_off、toggle、lock、unlock、open_cover、
            close_cover、stop_cover、set_brightness、set_color_temperature、
            set_position、set_temperature、set_hvac_mode、set_percentage、
            set_value、select_option、set_effect。只有用户明确表达目标值时才使用 set_* 动作。

            只输出 JSON，格式如下：
            {"device_name":"筒灯","action":"turn_on","value":null,"confidence":0.95}
            需要目标值时必须填写 value，例如：
            {"device_name":"筒灯","action":"set_brightness","value":50,"confidence":0.95}
            {"device_name":"空调","action":"set_temperature","value":24,"confidence":0.95}
            如果无法识别设备或操作，返回：
            {"device_name":null,"action":null,"value":null,"confidence":0,"error":"无法识别的指令"}
        - id: control-parse-user
          role: user
          text: '{{#sys.query#}}'
        selected: false
        title: 控制意图解析
        type: llm
        variables: []
        vision:
          enabled: false
      height: 132
      id: control_parse
      position:
        x: 980
        y: 40
      positionAbsolute:
        x: 980
        y: 40
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: |
          import json
          import re

          def main(llm_output: str) -> dict:
              try:
                  json_match = re.search(r'\{[^}]+\}', llm_output, re.DOTALL)
                  parsed = json.loads(json_match.group() if json_match else llm_output)
                  device_name = parsed.get("device_name") or ""
                  action = parsed.get("action") or "turn_on"
                  value = parsed.get("value")
                  if not device_name:
                      return {"device_name": "", "action": "", "data_json": "{}", "error": "无法识别设备"}
                  data_keys = {
                      "set_brightness": "brightness_pct",
                      "set_color_temperature": "color_temp_kelvin",
                      "set_position": "position",
                      "set_temperature": "temperature",
                      "set_hvac_mode": "hvac_mode",
                      "set_percentage": "percentage",
                      "set_value": "value",
                      "select_option": "option",
                      "set_effect": "effect",
                  }
                  if action in data_keys and value is None:
                      return {"device_name": device_name, "action": action, "data_json": "{}", "error": "控制指令缺少目标值"}
                  control_data = {data_keys[action]: value} if action in data_keys else {}
                  return {"device_name": device_name, "action": action, "data_json": json.dumps(control_data, ensure_ascii=False), "error": ""}
              except Exception as exc:
                  return {"device_name": "", "action": "", "data_json": "{}", "error": str(exc)}
        code_language: python3
        desc: 从控制意图 JSON 中提取 device_name 和 action
        outputs:
          device_name:
            children: null
            type: string
          action:
            children: null
            type: string
          data_json:
            children: null
            type: string
          error:
            children: null
            type: string
        selected: false
        title: 控制参数提取
        type: code
        variables:
        - value_selector:
          - control_parse
          - text
          variable: llm_output
      height: 54
      id: control_extract
      position:
        x: 1280
        y: 40
      positionAbsolute:
        x: 1280
        y: 40
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data: ''
          type: none
        desc: 按名称和动作查询平台动态设备台账
        headers: 'X-Agent-Key:{{#env.AGENT_API_KEY#}}'
        method: get
        params: 'name:{{#control_extract.device_name#}}

          action:{{#control_extract.action#}}'
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 1000
        selected: false
        ssl_verify: false
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 15
          max_write_timeout: 10
        title: 搜索设备
        type: http-request
        url: '{{#env.BACKEND_BASE_URL#}}/api/v1/devices/search'
        variables: []
      height: 136
      id: control_search_device
      position:
        x: 1580
        y: 40
      positionAbsolute:
        x: 1580
        y: 40
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: |
          import json

          def main(search_body: str, action: str) -> dict:
              try:
                  data = json.loads(search_body)
                  devices = data.get("devices", [])
                  if not devices:
                      return {"entity_id": "", "role": "", "device_name": "", "control_url": "", "action": action, "error": "设备未找到"}
                  device = devices[0]
                  entity_id = device.get("main_entity_id", "")
                  device_id = device.get("device_id", "")
                  role = device.get("main_role", "")
                  device_name = device.get("name", "")
                  return {
                      "entity_id": entity_id,
                      "role": role,
                      "device_name": device_name,
                      "control_url": f"/api/v1/devices/{device_id}/control",
                      "action": action,
                      "error": ""
                  }
              except Exception as exc:
                  return {"entity_id": "", "role": "", "device_name": "", "control_url": "", "action": action, "error": str(exc)}
        code_language: python3
        desc: 从搜索结果构建控制 URL 和请求体
        outputs:
          entity_id:
            children: null
            type: string
          role:
            children: null
            type: string
          device_name:
            children: null
            type: string
          control_url:
            children: null
            type: string
          action:
            children: null
            type: string
          error:
            children: null
            type: string
        selected: false
        title: 构建控制请求
        type: code
        variables:
        - value_selector:
          - control_search_device
          - body
          variable: search_body
        - value_selector:
          - control_extract
          - action
          variable: action
      height: 54
      id: control_build_request
      position:
        x: 1880
        y: 40
      positionAbsolute:
        x: 1880
        y: 40
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        authorization:
          config: null
          type: no-auth
        body:
